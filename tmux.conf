# macOS Terminal + tmux configuration
# Prefix: Ctrl-B. Custom menu: Ctrl-B, then m.
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10

bind-key | split-window -h
bind-key - split-window -v
bind-key -n M-Left select-pane -L
bind-key -n M-Right select-pane -R
bind-key -n M-Up select-pane -U
bind-key -n M-Down select-pane -D

# Copy tmux selections to macOS clipboard (pbcopy), while keeping tmux buffer.
set -s copy-command "/usr/bin/pbcopy"
set -s set-clipboard off
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel

# Avoid tmux's default right-click menu. Right-click paste is deliberately
# NOT enabled: it did not work reliably in the original setup.
unbind-key -T root MouseDown3Pane

# tmux popup menu, via Ctrl-B then m
bind-key m display-menu -T "tmux Menu" -x C -y C \
  "Split Left/Right" h "split-window -h" \
  "Split Top/Bottom" v "split-window -v" \
  "New Window" w "new-window" \
  "Choose Window" l "choose-tree -Zw" \
  "Close Pane" x "confirm-before kill-pane" \
  "Detach Session" d "detach-client"

bind-key r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
